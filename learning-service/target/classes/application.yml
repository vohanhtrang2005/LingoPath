server:
  port: 8082

spring:
  application:
    name: learning-service
  datasource:
    url: jdbc:postgresql://learning-db:5432/learning_db
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

gakudo:
  services:
    content-service-url: ${CONTENT_SERVICE_URL:http://content-service:8083}

