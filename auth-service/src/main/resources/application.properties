spring.application.name=auth-service
gakudo.jwt.access-token-validity-in-seconds=900
gakudo.jwt.refresh-token-validity-in-seconds=604800
gakudo.jwt.key-id=gakudo-auth-key
# Optional for stable production tokens. Values may contain escaped newlines (\n).
gakudo.jwt.private-key=${JWT_PRIVATE_KEY:}
gakudo.jwt.public-key=${JWT_PUBLIC_KEY:}
gakudo.admin.email=${GAKUDO_ADMIN_EMAIL:}
gakudo.admin.password=${GAKUDO_ADMIN_PASSWORD:}
server.port=8081
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
